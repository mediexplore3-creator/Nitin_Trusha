<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Nitin And Trusha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <header class="main-header">
      <div class="logo">
    <h2><img src="https://i.postimg.cc/0jNjXkKR/1000051320-removebg-preview.png" alt="" /></h2>
        </div>
        <nav>
            <ul class="navlist">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="Services.html">Services</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li id="authLinks">
                    <!-- Dynamic auth links will be inserted here -->
                </li>
            </ul>
        </nav>
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-header">
            <h3>Navigation</h3>
            <button class="close-menu" id="closeMenu">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="mobile-nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="Services.html">Services</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li id="mobileAuthLinks">
                <!-- Dynamic mobile auth links will be inserted here -->
            </li>
        </ul>
    </div>
    <div class="overlay" id="overlay"></div>

    <main>
        <div class="form-container">
            <h1>Create Account</h1>
            <form id="registerForm">
                <div class="form-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;" id="registerBtn">
                    <span id="registerText">Register</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>
            <p>Already have an account? <a href="form-login.html">Login here</a></p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="social-icons">
            <a href="https://www.instagram.com/itz_nitin_sharma08"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="https://discord.gg/WnUzMqQd"><i class="fab fa-discord"></i></a>
        </div>
        <p>&copy; 2025 Nitin And Trusha. All rights reserved.</p>
        <p>Developed by Nitin And Trusha</p>
    </footer>

    <!-- Scroll to Top Button -->
    <div class="scroll-to-top" id="scrollToTop">
        <i class="fas fa-arrow-up"></i>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDg0IEoIbnoXZc79qgFGrWnAiJKtOUcdSU",
    authDomain: "nd-store-399c9.firebaseapp.com",
    projectId: "nd-store-399c9",
    storageBucket: "nd-store-399c9.firebasestorage.app",
    messagingSenderId: "789884520415",
    appId: "1:789884520415:web:9b78785ed3837d3c64666a",
    measurementId: "G-K4DXJFLXFZ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Set persistence to LOCAL to keep user logged in
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
            .catch((error) => {
                console.error('Error setting auth persistence:', error);
            });

        // Update navigation based on auth state
        function updateNavigation(user) {
            const authLinks = document.getElementById('authLinks');
            const mobileAuthLinks = document.getElementById('mobileAuthLinks');
            
            const authHTML = user ? `
                <li class="nav-user-profile">
                    <a href="profile.html" class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                        <span>Profile</span>
                    </a>
                    <ul class="user-dropdown">
                        <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                        <li><a href="profile.html?tab=settings"><i class="fas fa-cog"></i> Settings</a></li>
                        <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
                </li>
            ` : `
                <li><a href="form-login.html">Profile</a></li>
            `;
            
            const mobileAuthHTML = user ? `
                <li class="nav-user-profile mobile">
                    <a href="profile.html" class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                        <span>Profile</span>
                    </a>
                    <ul class="user-dropdown">
                        <li><a href="profile.html"><i class="fas fa-user"></i> My Profile</a></li>
                        <li><a href="profile.html?tab=settings"><i class="fas fa-cog"></i> Settings</a></li>
                        <li><a href="#" id="mobileLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
                </li>
            ` : `
                <li><a href="form-login.html">Profile</a></li>
            `;
            
            if (authLinks) authLinks.innerHTML = authHTML;
            if (mobileAuthLinks) mobileAuthLinks.innerHTML = mobileAuthHTML;
            
            // Add logout functionality
            const logoutBtn = document.getElementById('logoutBtn');
            const mobileLogoutBtn = document.getElementById('mobileLogoutBtn');
            
            if (logoutBtn) {
                logoutBtn.addEventListener('click', handleLogout);
            }
            if (mobileLogoutBtn) {
                mobileLogoutBtn.addEventListener('click', handleLogout);
            }
        }

        // Handle logout
        async function handleLogout(e) {
            e.preventDefault();
            try {
                await auth.signOut();
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error during logout. Please try again.');
            }
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            updateNavigation(user);
            if (user) {
                // User is already logged in, redirect to profile
                console.log('User already logged in, redirecting to profile...');
                window.location.href = 'profile.html';
            }
        });

        // Mobile Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const mobileNav = document.getElementById('mobileNav');
        const closeMenu = document.getElementById('closeMenu');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', () => {
            mobileNav.classList.add('active');
            overlay.classList.add('active');
        });

        closeMenu.addEventListener('click', () => {
            mobileNav.classList.remove('active');
            overlay.classList.remove('active');
        });

        overlay.addEventListener('click', () => {
            mobileNav.classList.remove('active');
            overlay.classList.remove('active');
        });

        // Scroll to Top Functionality
        const scrollToTopBtn = document.getElementById('scrollToTop');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                scrollToTopBtn.classList.add('active');
            } else {
                scrollToTopBtn.classList.remove('active');
            }
        });

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Registration Form with Firebase
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const registerText = document.getElementById('registerText');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Show loading state
            registerBtn.disabled = true;
            registerText.innerHTML = 'Creating Account... <i class="fas fa-spinner fa-spin"></i>';

            // Basic validation
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                registerBtn.disabled = false;
                registerText.innerHTML = 'Register';
                return;
            }

            if (password.length < 6) {
                alert('Password should be at least 6 characters long!');
                registerBtn.disabled = false;
                registerText.innerHTML = 'Register';
                return;
            }

            try {
                // Create user with Firebase Authentication
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                console.log('User created:', user.email);

                // Store additional user data in Firestore
                await db.collection('users').doc(user.uid).set({
                    username: username,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });

                console.log('User data saved to Firestore, redirecting to profile...');

                // Wait a moment to ensure auth state is persisted
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1000);

            } catch (error) {
                console.error('Error during registration:', error);
                let errorMessage = 'Registration failed. ';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage += 'Email is already registered.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage += 'Email address is invalid.';
                        break;
                    case 'auth/weak-password':
                        errorMessage += 'Password is too weak.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage += 'Email/password accounts are not enabled. Please contact support.';
                        break;
                    default:
                        errorMessage += error.message;
                }
                
                alert(errorMessage);

                // Reset button
                registerBtn.disabled = false;
                registerText.innerHTML = 'Register';
            }
        });
    </script>
</body>
</html>
